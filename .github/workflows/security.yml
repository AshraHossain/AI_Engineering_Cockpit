name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly scan, catches newly-disclosed CVEs even without code changes.
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bandit:
    name: Static analysis (bandit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Run bandit
        run: uv run bandit -r cockpit -ll -x '*/tests/*'

  secrets-scan:
    name: Secret scan (detect-secrets)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11

      - name: Scan for committed secrets
        # graphify-out/ is generated: every string in it is copied from files this
        # scan already covers, plus public hashes (a commit SHA, a CDN integrity
        # hash) that trip the entropy detectors. It is rewritten on each rebuild,
        # so inline pragmas or a baseline would not survive there.
        # .detectsecrets is the baseline file: it contains known/audited "secrets"
        # and should not be scanned against itself.
        run: uvx detect-secrets scan --all-files --exclude-files '\.git/|\.venv|uv\.lock|^graphify-out/|\.detectsecrets|node_modules/' > /tmp/secrets-scan.json

      - name: Fail if new secrets are found
        run: |
          uvx detect-secrets audit --diff .detectsecrets /tmp/secrets-scan.json
          echo "No new secrets detected (all secrets are in the baseline)."

  dependency-audit:
    name: Dependency vulnerability audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Export requirements for audit
        run: uv export --all-groups --no-hashes --format requirements-txt > requirements-audit.txt

      - name: Audit dependencies (pip-audit)
        run: uvx pip-audit -r requirements-audit.txt --skip-editable
