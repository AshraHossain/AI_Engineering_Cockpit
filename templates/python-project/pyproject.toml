[project]
name = "{{PROJECT_NAME}}"
version = "0.1.0"
description = "{{DESCRIPTION}}"
authors = [{ name = "{{AUTHOR_NAME}}", email = "{{AUTHOR_EMAIL}}" }]
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "python-dotenv>=1.0",
    # Add what you actually use. For Gemini:
    #   "google-genai>=1.0"
    # Note: google-generativeai is end-of-life -- do not use it.
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "black>=24.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "bandit>=1.7",
]

# To reuse the cockpit frameworks (PII masking, injection detection, cost
# tracking, RBAC, audit logging) rather than reimplementing them:
#
#   uv add git+https://github.com/AshraHossain/AI_Engineering_Cockpit
#
# That requires cockpit to be published as an installable package first --
# it is currently repo-internal. Until then, copy the module you need.

[project.scripts]
{{PROJECT_NAME}} = "{{PACKAGE_NAME}}.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/{{PACKAGE_NAME}}"]

# --- Tool config lives HERE, not in a config/ subdirectory ---------------
#
# Learned the hard way: pytest, ruff, and mypy only auto-discover config at
# the project root. Putting it in config/ means every invocation needs
# explicit flags (-c config/pytest.ini --rootdir=.), and the day someone
# forgets one, the tool silently runs with different settings than CI.
# Inline is boring and it always works.

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers -ra"
filterwarnings = ["error"]
# No `pythonpath` entry on purpose. The project is installed into the venv
# (editable) by `uv sync`, so tests import it exactly the way a real caller
# does. A pythonpath shim would let tests pass against a layout that the
# installed package does not actually have.

[tool.ruff]
target-version = "py311"
# Must match black's line-length below. A mismatch means the two tools
# fight each other forever.
line-length = 100

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "N",        # pep8-naming
    "UP",       # pyupgrade
    "B",        # bugbear
    "C4",       # comprehensions
    "SIM",      # simplify
    "RET",      # return
    "T20",      # no print() outside a CLI entry point
    "S",        # bandit-style security lints
    "RUF",
]
ignore = [
    "E501",   # line length is the formatter's job
    "S101",   # assert is expected in tests
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "ARG001", "ARG002"]
# A CLI's actual output belongs on stdout, not in a log line.
"src/**/main.py" = ["T201"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
show_error_codes = true
pretty = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

# Provider SDKs that ship no type stubs. Add to this list rather than
# loosening the global settings -- a blanket ignore_missing_imports hides
# real typos in your own module names.
[[tool.mypy.overrides]]
module = ["google.*", "openai.*", "anthropic.*"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["src"]

[tool.coverage.report]
show_missing = true
# Start here, raise it as the project earns it. A gate you cannot meet gets
# deleted; a gate slightly above where you are gets met.
fail_under = 70
