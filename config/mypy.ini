; mypy configuration for AI_Engineering_Cockpit.
;
; Lives in config/ (not repo root). Invoke explicitly with:
;   uv run mypy --config-file config/mypy.ini cockpit
;
; Reasonably strict (catches real bugs: untyped defs, unreachable code,
; unsafe Optional handling) without demanding perfection from third-party
; stubs or example scripts that intentionally stay loose.

[mypy]
python_version = 3.11
mypy_path = .

; --- Strictness: on for the cockpit/ core, meaningful but not exhausting ---
disallow_untyped_defs = True
disallow_incomplete_defs = True
check_untyped_defs = True
disallow_untyped_decorators = False
warn_redundant_casts = True
warn_unused_ignores = True
warn_unused_configs = True
warn_return_any = True
warn_no_return = True
warn_unreachable = True
no_implicit_optional = True
strict_equality = True

; --- Ergonomics: don't demand type stubs that don't exist, don't explode on
; every third-party import ---
ignore_missing_imports = True
follow_imports = normal
show_error_codes = True
pretty = True
color_output = True

; The internal package is named `cockpit/`, not `platform/` — the spec's
; original name collided with stdlib `platform` and caused real pytest
; INTERNALERROR crashes via sys.path races, so it was renamed. Exclude
; generated/output directories from analysis.
exclude = (?x)(
    ^\.venv/
    | ^venv/
    | ^build/
    | ^dist/
    | ^outputs/
    | ^models/
    | ^htmlcov/
    | ^\.mypy_cache/
  )

; --- Example projects: working demos, not library code — keep this loose ---
[mypy-projects.*]
disallow_untyped_defs = False
disallow_incomplete_defs = False
check_untyped_defs = False

; --- Tests: fixtures and mocks are frequently untyped by nature ---
[mypy-tests.*]
disallow_untyped_defs = False
disallow_incomplete_defs = False

[mypy-*.tests.*]
disallow_untyped_defs = False
disallow_incomplete_defs = False

; --- Third-party packages without bundled/py.typed stubs ---
[mypy-google.generativeai.*]
ignore_missing_imports = True

[mypy-ollama.*]
ignore_missing_imports = True
