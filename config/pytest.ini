; pytest configuration for AI_Engineering_Cockpit.
;
; Lives in config/ (not repo root). Invoke explicitly with:
;   uv run pytest -c config/pytest.ini
; or point your IDE's pytest args at this file (see .vscode/settings.json).

[pytest]
minversion = 8.0

testpaths =
    tests
    cockpit

python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

addopts =
    --strict-markers
    --strict-config
    -ra
    --cov=cockpit
    --cov-config=config/.coveragerc
    --cov-report=term-missing
    --cov-report=html
    --cov-fail-under=80

markers =
    unit: fast, isolated unit tests
    integration: tests that exercise multiple components together
    e2e: end-to-end tests that may hit real or mocked external services
    slow: tests that are known to take a while to run
    live_provider: tests that need real, live provider credentials and are skipped by default in CI

filterwarnings =
    error
    ignore::DeprecationWarning:google.*
    ignore::DeprecationWarning:pydantic.*

log_cli = false
log_cli_level = INFO
