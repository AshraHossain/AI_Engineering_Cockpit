[project]
name = "ai-engineering-cockpit"
version = "0.1.0"
description = "Production-grade AIDevOps platform: testing, evaluation, red-teaming, security, monitoring, and governance for AI systems."
authors = [{ name = "Ash", email = "AshraHossain@users.noreply.github.com" }]
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    # google-genai supersedes google-generativeai, which reached end of life
    # ("All support for the google.generativeai package has ended").
    "google-genai>=1.0",
    "openai>=1.40",
    "anthropic>=0.34",
    "requests>=2.32",
    "python-dotenv>=1.0",
    # The one place stdlib-only is the wrong call. Python ships secure
    # password hashing (hashlib.scrypt) and HMAC, but no authenticated
    # symmetric encryption -- and hand-rolling AEAD inside a module called
    # data_security.py would be worse than having no encryption at all.
    "cryptography>=43.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "black>=24.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "bandit>=1.7",
]

[tool.uv]
# ponytail: spec called the platform package `platform/`, which shadows stdlib
# `platform` and caused confirmed pytest INTERNALERROR crashes (sys.path race).
# Renamed the package to `cockpit/`. Left as an unbuilt/uninstalled project
# (application, not a library) since nothing else needs to import this by name.
package = false
