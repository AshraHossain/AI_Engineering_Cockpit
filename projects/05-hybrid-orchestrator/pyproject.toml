[project]
name = "hybrid-orchestrator"
version = "0.1.0"
description = "Hybrid routing between a local Ollama model and cloud Gemini, with graceful fallback where Ollama isn't available."
authors = [{ name = "Ash", email = "ashrafuzzmanhossain@gmail.com" }]
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "google-genai>=1.0",
    "requests>=2.32",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[tool.uv]
package = false

[tool.ruff.lint.per-file-ignores]
# src/main.py prints the CLI's actual output (the answer, not a diagnostic) --
# routing that through logging would prefix it with timestamps/levels.
"src/main.py" = ["T201"]
