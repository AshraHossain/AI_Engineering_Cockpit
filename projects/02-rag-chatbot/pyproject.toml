[project]
name = "rag-chatbot"
version = "0.1.0"
description = "Minimal Retrieval-Augmented Generation demo: chunk, retrieve, augment, and answer with Gemini."
authors = [{ name = "Ash", email = "AshraHossain@users.noreply.github.com" }]
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "google-genai>=1.0",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
