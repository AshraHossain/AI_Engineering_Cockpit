[project]
name = "agent-tool-use"
version = "0.1.0"
description = "LLM function calling / tool use: automatic and manual modes, allowlist-authorized tool execution, instrumented with the cockpit frameworks."
authors = [{ name = "Ash", email = "ashrafuzzmanhossain@gmail.com" }]
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "google-genai>=1.0",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
# "src" makes this project's own modules importable; "../.." puts the repo
# root on sys.path so `cockpit.*` resolves. The root is deliberately
# `package = false`, so it is never installed into this project's venv.
pythonpath = ["src", "../.."]
testpaths = ["tests"]

[tool.ruff.lint.per-file-ignores]
# T201: src/main.py prints the CLI's actual output (the answer and the trace,
#   not a diagnostic) -- routing that through logging would prefix it with
#   timestamps/levels.
# E402: src/main.py must put the repo root on sys.path *before* importing the
#   modules that import `cockpit.*`, so those imports cannot sit at the top.
"src/main.py" = ["T201", "E402"]
