[project]
name = "red-team-runner"
version = "0.1.0"
description = "Run the cockpit prompt-injection corpus and edge-case suite against a target, and report the request-time defense-coverage gap."
authors = [{ name = "Ash", email = "AshraHossain@users.noreply.github.com" }]
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "google-genai>=1.0",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
# "../.." puts the repo root on sys.path: it is package=false by design, so
# the cockpit frameworks are imported from source rather than installed.
pythonpath = ["src", "../.."]
testpaths = ["tests"]

[tool.ruff.lint.per-file-ignores]
# src/main.py prints the CLI's actual output (the report, not a diagnostic) --
# routing that through logging would prefix it with timestamps/levels.
"src/main.py" = ["T201"]
